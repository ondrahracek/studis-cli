[package]
name = "studis-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "Unofficial command-line interface for the Brno University of Technology information system"
license = "MIT"
repository = "https://github.com/ondrahracek/studis-cli"
readme = "README.md"
publish = false

[[bin]]
name = "studis"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyring = "=4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "query", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
