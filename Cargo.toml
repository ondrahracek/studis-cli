[package]
name = "studis-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "Unofficial command-line interface for the Brno University of Technology information system"
license = "MIT"
repository = "https://github.com/ondrahracek/studis-cli"
readme = "README.md"
publish = false

[[bin]]
name = "studis"
path = "src/main.rs"

[dependencies]
caseless = "0.2.2"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
headless_chrome = "1.0.22"
reqwest = { version = "0.13.5", features = ["blocking", "query", "rustls"], default-features = false }
scraper = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
keyring = "=4.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
